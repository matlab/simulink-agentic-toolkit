<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OKF bundle</title>
<!-- Generated by kb.Bundle.viz. Copyright 2026 The MathWorks, Inc. -->
<script src="https://unpkg.com/cytoscape@3.28.1/dist/cytoscape.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; display: flex;
         height: 100vh; background: #1a1a19; color: #c3c2b7; }
  #cy { flex: 1; }
  #panel { width: 320px; background: #232322; padding: 16px; overflow-y: auto;
           border-left: 1px solid #33332f; font-size: 13px; }
  #panel h2 { color: #ffffff; margin-bottom: 12px; font-size: 16px; overflow-wrap: anywhere; }
  #panel .field { margin-bottom: 10px; }
  #panel .label { color: #898781; font-size: 11px; text-transform: uppercase; }
  #panel .value { overflow-wrap: anywhere; }
  #panel a { color: #c3c2b7; cursor: pointer; text-decoration: underline dotted; }
  #toolbar { position: absolute; top: 12px; left: 12px; z-index: 10; display: flex; gap: 8px; }
  #toolbar input, #toolbar select { padding: 6px 10px; border-radius: 4px; border: 1px solid #33332f;
                                    background: #232322; color: #ffffff; font-size: 13px; }
  #toolbar input { width: 220px; }
  #legend { position: absolute; bottom: 12px; left: 12px; z-index: 10; background: rgba(35,35,34,0.92);
            padding: 8px 12px; border-radius: 4px; font-size: 12px; line-height: 1.8; }
  #legend .item { margin-right: 14px; white-space: nowrap; }
  #legend .glyph { display: inline-block; width: 16px; text-align: center; margin-right: 4px; font-size: 14px; }
</style>
</head>
<body>
<div id="toolbar">
  <input id="search" type="text" placeholder="Search title, tags, path..." />
  <select id="layout">
    <option value="cose">Force-directed</option>
    <option value="concentric">Concentric</option>
    <option value="breadthfirst">Tree</option>
    <option value="circle">Circle</option>
    <option value="grid">Grid</option>
  </select>
</div>
<div id="cy"></div>
<div id="panel"></div>
<div id="legend"></div>

<script>
const data = /*DATA*/null;
const MUTED = '#898781';
const GLYPH = { 'ellipse': '&#9679;', 'round-rectangle': '&#9632;', 'diamond': '&#9670;',
                'triangle': '&#9650;', 'hexagon': '&#11042;', 'star': '&#9733;', 'pentagon': '&#11039;' };
const KIND = { missing: 'Broken link (no such page)', outside: 'Outside this bundle' };

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
}

document.title = data.title;
const style = {};
data.types.forEach(t => style[t.name] = t);

const elements = [];
data.nodes.forEach(n => {
  const t = style[n.type] || { color: MUTED, shape: 'ellipse' };
  elements.push({ group: 'nodes', classes: n.kind,
                  data: Object.assign({}, n, { color: t.color, shape: t.shape }) });
});
data.edges.forEach(e => elements.push({ group: 'edges', data: { source: e.source, target: e.target } }));

const cy = cytoscape({
  container: document.getElementById('cy'),
  elements: elements,
  style: [
    { selector: 'node', style: {
        'label': 'data(label)', 'background-color': 'data(color)', 'shape': 'data(shape)',
        'width': 'data(size)', 'height': 'data(size)',
        'border-width': 2, 'border-color': '#1a1a19',
        'font-size': '10px', 'color': '#c3c2b7', 'text-valign': 'bottom', 'text-margin-y': 6,
        'text-max-width': '90px', 'text-wrap': 'ellipsis' } },
    { selector: 'node.missing, node.outside', style: {
        'background-opacity': 0, 'border-color': MUTED, 'shape': 'ellipse', 'color': MUTED } },
    { selector: 'node.missing', style: { 'border-style': 'dashed' } },
    { selector: 'node.outside', style: { 'border-style': 'dotted' } },
    { selector: 'edge', style: {
        'width': 1.5, 'line-color': '#4a4945', 'target-arrow-color': '#4a4945',
        'target-arrow-shape': 'triangle', 'curve-style': 'bezier', 'arrow-scale': 0.8 } },
    { selector: '.highlighted', style: { 'border-width': 3, 'border-color': '#ffffff' } },
    { selector: 'edge.highlighted', style: { 'line-color': '#c3c2b7', 'target-arrow-color': '#c3c2b7' } },
    { selector: '.faded', style: { 'opacity': 0.15 } },
  ],
  layout: { name: 'cose', animate: false, nodeDimensionsIncludeLabels: true },
});

function field(label, html) {
  return `<div class="field"><div class="label">${esc(label)}</div><div class="value">${html || '&mdash;'}</div></div>`;
}
function links(nodes) {
  return nodes.map(n => `<a data-id="${esc(n.id())}">${esc(n.data('label'))}</a>`).join('<br/>');
}
function resetPanel() {
  document.getElementById('panel').innerHTML =
    `<h2>${esc(data.title)}</h2><p style="color:${MUTED}">${data.nodes.filter(n => n.kind === 'page').length} pages, ` +
    `${data.edges.length} links. Click a node to inspect.</p>`;
}
function select(node) {
  const d = node.data();
  const out = node.outgoers('node'), inc = node.incomers('node');
  const rows = d.kind === 'page'
    ? [field('Type', esc(d.type)), field('Path', esc('/' + d.id + '.md')), field('Description', esc(d.description)),
       field('Tags', esc(d.tags)), field('Status', esc(d.status))]
    : [field('Kind', esc(KIND[d.kind])), field('Target', esc(d.id))];
  document.getElementById('panel').innerHTML = `<h2>${esc(d.label)}</h2>` + rows.join('') +
    field(`Links to (${out.length})`, links(out)) + field(`Linked from (${inc.length})`, links(inc));
  cy.elements().removeClass('highlighted faded');
  const hood = node.closedNeighborhood();
  cy.elements().not(hood).addClass('faded');
  hood.addClass('highlighted');
}

cy.on('tap', 'node', evt => select(evt.target));
cy.on('tap', evt => { if (evt.target === cy) { cy.elements().removeClass('highlighted faded'); resetPanel(); } });
document.getElementById('panel').addEventListener('click', e => {
  const id = e.target.dataset && e.target.dataset.id;
  if (id) select(cy.getElementById(id));
});

document.getElementById('search').addEventListener('input', e => {
  const q = e.target.value.toLowerCase();
  cy.elements().removeClass('highlighted faded');
  if (!q) return;
  const hits = cy.nodes().filter(n => [n.data('label'), n.data('tags'), n.id()]
    .some(s => String(s || '').toLowerCase().includes(q)));
  if (hits.length) { cy.elements().not(hits).addClass('faded'); hits.addClass('highlighted'); }
});

document.getElementById('layout').addEventListener('change', e => {
  cy.layout({ name: e.target.value, animate: true, nodeDimensionsIncludeLabels: true }).run();
});

const legend = data.types.map(t =>
  `<span class="item"><span class="glyph" style="color:${t.color}">${GLYPH[t.shape]}</span>${esc(t.name)} (${t.count})</span>`);
const kinds = new Set(data.nodes.map(n => n.kind));
if (kinds.has('missing')) legend.push(`<span class="item"><span class="glyph" style="color:${MUTED}">&#9711;</span>broken link (dashed)</span>`);
if (kinds.has('outside')) legend.push(`<span class="item"><span class="glyph" style="color:${MUTED}">&#9711;</span>outside bundle (dotted)</span>`);
document.getElementById('legend').innerHTML = legend.join(' ');
resetPanel();
</script>
</body>
</html>
