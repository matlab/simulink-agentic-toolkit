# manifest.yaml — Tooling metadata for simulink-check-rapid-accelerator-compatibility
schema-version: 1
license: https://www.mathworks.com/content/dam/mathworks/license/pmrl/license.md
scope: product-specific
version: "1.0"
human-description: >-
  Check a Simulink model for rapid accelerator mode incompatibilities.
matlab-release: ">=R2023a"
toolkit: simulink-agentic-toolkit
required-products:
  - Simulink
  - Simulink Coder  # Static analysis (Steps 1-3) needs only Simulink; verify-build (Step 4) needs Coder. Users checking raccel compatibility will have Coder since raccel mode itself requires it.
optional-products:
  - Stateflow
  - Fixed-Point Designer
required-tools:
  - evaluate_matlab_code
  - model_edit
  - model_read
  - model_query_params
required-skills: []
reference-files:
  - references/incompatibility-catalog.md
  - references/fix-recipes.md
