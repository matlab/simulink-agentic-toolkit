# manifest.yaml — Tooling metadata for building-simulink-models
schema-version: 1
license: https://www.mathworks.com/content/dam/mathworks/license/pmrl/license.md
scope: cross-product
version: "1.4"
human-description: Builds and edits Simulink, System Composer, Stateflow, and Simscape models. Use when modifying model structure, parameters, ports, connections, or Stateflow chart internals.
matlab-release: ">=R2023a"
toolkit: simulink-agentic-toolkit
required-products:
  - Simulink
optional-products:
  - Stateflow
  - System Composer
  - Simscape
required-tools:
  - model_edit
  - model_overview
  - model_read
  - model_check
  - model_query_params
  - model_resolve_params
required-skills: []
reference-files:
  - references/stateflow.md
  - references/system-composer.md
  - references/simscape.md
