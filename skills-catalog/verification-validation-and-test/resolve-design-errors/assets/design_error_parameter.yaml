- id: parameter_error
  name: "Parameter Values Treated as Constants"
  description: >
    If your model contains parameters, Simulink Design Verifier treats the
    values as constants by default. This might cause dead logic. In these
    cases, consider configuring these parameters to be tuned during analysis.
  yaml_example: |
    Name: Parameter
    Inputs:
      - In1
      - In2
      - In5
    Outputs: Out1
    ChildrenBlocks:
      - Name: Constant
        Type: Constant
        Info:
          Value: ParamA
        Outputs:
          Out1: Add.In1
      - Name: Constant1
        Type: Constant
        Info:
          Value: ParamB
        Outputs:
          Out1: Add.In2
      - Name: Constant2
        Type: Constant
        Info:
          Value: ParamC
        Outputs:
          Out1: Add1.In1
      - Name: Add
        Type: Sum
        Info:
          Equation: out = in1  + in2
        Inputs:
          In1: Constant.Out1
          In2: Constant1.Out1
        Outputs:
          Out1: Product.In1
      - Name: Constant3
        Type: Constant
        Info:
          Value: ParamD
        Outputs:
          Out1: Add1.In2
      - Name: Add1
        Type: Sum
        Info:
          Equation: out = in1  + in2
        Inputs:
          In1: Constant2.Out1
          In2: Constant3.Out1
        Outputs:
          Out1: Product.In3
      - Name: In1
        Type: Inport
        Outputs:
          Out1: Product.In2
      - Name: Product
        Type: Product
        Info:
          Equation: "out = in1 * in2 * in3"
        Inputs:
          In1: Add.Out1
          In2: In1.Out1
          In3: Add1.Out1
        Outputs:
          Out1: Switch.In2
      - Name: In2
        Type: Inport
        Outputs:
          Out1: Switch.In1
      - Name: Switch
        Type: Switch
        Info:
          Criteria: "in2 > 0"
        Inputs:
          In1: In2.Out1
          In2: Product.Out1
          In3: In5.Out1
        Outputs:
          Out1: Out1.In1
      - Name: In5
        Type: Inport
        Outputs:
          Out1: Switch.In3
      - Name: Out1
        Type: Outport
        Inputs:
          In1: Switch.Out1
