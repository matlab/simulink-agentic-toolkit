- id: defensive_logic
  name: "Defensive Logic in Library Blocks"
  description: >
    Library blocks may be written with defensive conditions that are redundant
    in some of the locations where they are used. In some cases, this may cause
    dead logic. See "Exclude and Justify Objectives for Design Error Detection".
  yaml_example: |
    Name: DefensiveLogic
    Inputs:
      - In3
      - In2
      - In1
    Outputs: Out1
    ChildrenBlocks:
      - Name: In2
        Type: Inport
        Outputs:
          Out1:
            - "Less Than.In1 []"
            - "Max.In2 []"
            - "Min.In1 []"
      - Name: In1
        Type: Inport
        Outputs:
          Out1:
            - "Gain.In1 []"
            - "Max.In1 []"
      - Name: Gain
        Type: Gain
        Info:
          GainValue: "-1"
        Inputs:
          In1: In1.Out1
        Outputs:
          Out1: Min.In2
      - Name: Min
        Type: MinMax
        Inputs:
          In1: In2.Out1
          In2: Gain.Out1
        Outputs:
          Out1: Switch.In1
      - Name: Constant
        Type: Constant
        Info:
          Value: "0"
        Outputs:
          Out1: Less Than.In2
      - Name: Less Than
        Type: RelationalOperator
        Info:
          Operation: in1 < in2
        Inputs:
          In1: In2.Out1
          In2: Constant.Out1
        Outputs:
          Out1: Switch.In2
      - Name: Max
        Type: MinMax
        Inputs:
          In1: In1.Out1
          In2: In2.Out1
        Outputs:
          Out1: Switch.In3
      - Name: Switch
        Type: Switch
        Info:
          Criteria: "in2 > 0"
        Inputs:
          In1: Min.Out1
          In2: Less Than.Out1
          In3: Max.Out1
        Outputs:
          Out1: Divide.In2
      - Name: In3
        Type: Inport
        Outputs:
          Out1: Divide.In1
      - Name: Divide
        Type: Product
        Info:
          Equation: "out = (in1) * (1/in2)"
        Inputs:
          In1: In3.Out1
          In2: Switch.Out1
        Outputs:
          Out1: Out1.In1
      - Name: Out1
        Type: Outport
        Inputs:
          In1: Divide.Out1
