schema-version: 1
version: "1.2"
license: https://www.mathworks.com/content/dam/mathworks/license/pmrl/license.md
scope: product-specific
toolkit: simulink-agentic-toolkit
human-description: >
  Author or upgrade Model Advisor checks for Simulink and System Composer models.
  Covers the full lifecycle: guideline authoring, check specification, check
  implementation, and qualification testing. Supports new check creation (edit-time,
  standard batch, config-parameter, auto-fix) and converting legacy
  StyleOne/StyleTwo/StyleThree checks to modern DetailStyle.
matlab-release: ">=R2023a"
required-products:
  - Simulink
  - Simulink Check
optional-products:
  - Stateflow
  - Requirements Toolbox
required-tools:
  - check_matlab_code
  - evaluate_matlab_code
  - model_edit
  - run_matlab_test_file
required-skills: []
reference-files:
  - references/index.md
  - references/procedures/author-guideline.md
  - references/procedures/author-check.md
  - references/procedures/test-check.md
  - references/templates/guideline.md
  - references/templates/check-spec.md
  - references/templates/test-spec.md
  - references/templates/test-recipes.md
  - references/patterns/standard.md
